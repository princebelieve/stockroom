services:
  - type: web
    name: stockroom-sync-api
    runtime: node
    buildCommand: npm ci
    startCommand: npm run sync-api
    healthCheckPath: /health
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_API_KEY
        generateValue: true
      - key: MONGODB_DATABASE
        value: stockroom_sync
