services:
  - type: web
    name: stockroom-sync-api
    runtime: node
    buildCommand: npm ci
    startCommand: npm run sync-api
    healthCheckPath: /health
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_API_KEY
        generateValue: true
      - key: MONGODB_DATABASE
        value: stockroom_sync
      - key: GMAIL_USER
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_REFERRAL_AUTO_PAYOUTS
        value: "false"
      - key: PAYSTACK_REFERRAL_WEBHOOK_READY
        value: "false"
      - key: SUBSCRIPTION_PUBLIC_URL
        sync: false
      - key: DEVELOPER_EMAIL
        sync: false
      - key: PWA_ALLOWED_ORIGINS
        value: https://stockroom.globalcreest.com
      - key: GMAIL_CLIENT_ID
        sync: false
      - key: GMAIL_CLIENT_SECRET
        sync: false
      - key: GMAIL_REFRESH_TOKEN
        sync: false
